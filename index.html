<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>Sign in - LPio / LaunchPad IO</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
  <main class="login-shell">
    <div class="login-card">
      <div class="wordmark">LPio <span>/</span> LaunchPad IO</div>
      <p class="lede">A shared workspace for developer guidance, reference material,
        prototypes and independent project silos. Access is by invitation.</p>

      <form id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" required>
        </div>
        <p id="login-notice" class="notice error hidden" role="alert"></p>
        <button id="login-submit" class="button" type="submit">Sign in</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/core/config.js"></script>
  <script src="assets/js/core/supabase.js"></script>
  <script src="assets/js/core/auth.js"></script>
</body>
</html>
