<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://zlmkofbkobmhnslfnqsf.supabase.co" crossorigin>
  <title>Sign in - LPIO</title>
  <script src="assets/js/core/theme.js"></script>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/login.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.3"></script>
  <script defer src="assets/js/core/supabase.js"></script>
  <script defer src="assets/js/core/auth.js"></script>
</head>
<body>
  <main class="login-shell">
    <section class="login-main">
      <div class="login-card">
        <a class="login-wordmark login-wordmark-compact" href=".">LPIO</a>
        <div class="login-head">
          <h2>Please sign in</h2>
        </div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" autocomplete="username"
              autocapitalize="none" spellcheck="false" required autofocus>
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" autocomplete="current-password" required>
          </div>
          <p id="login-notice" class="notice error hidden" role="alert" aria-live="polite"></p>
          <button id="login-submit" class="button button-block" type="submit">Sign in</button>
        </form>
      </div>
    </section>
  </main>

</body>
</html>
