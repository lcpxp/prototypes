<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 720 950" role="img">
  <title>Daopay EU onboarding - handoff and decision</title>
  <desc>A completed application is worked by PXP: both the merchant contract and the Daopay KYC contract are generated, the merchant contract is sent, and screening checks complete with PDF reports. The contract goes to the merchant first; once they sign, the Daopay CEO countersigns and then the CTO. Full signature automatically transfers everything to Daopay - merchant and application data through the CRM integration, contract files and screening PDFs through SFTP - and notifies the Daopay compliance team. Daopay compliance reviews the merchant data in their CRM, then the documents in their file storage, then opens the portal to record one of three outcomes: reject, pending further information which notifies the PXP accounts team, or approve by pressing Send KYC and approve merchant. On approval the merchant signs the KYC contract, completing onboarding.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .th { font-size: 13px; font-weight: 600; fill: #2C2C2A; }
      .ts { font-size: 11px; font-weight: 400; fill: #5F5E5A; }
      .lane rect { fill: #FBFAF7; stroke: #E5E7EB; }
      .lanehead rect { fill: #F1EFE8; stroke: #B4B2A9; }
      .lanehead text { font-size: 12px; font-weight: 700; fill: #2C2C2A; letter-spacing: 0.04em; }
      .arr { stroke: #5F5E5A; stroke-width: 1; fill: none; }
      .auto { stroke-dasharray: 5 4; }
      .cgray rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .cblue rect { fill: #EEEDFE; stroke: #292CF5; }
      .cblue .th { fill: #25288A; } .cblue .ts { fill: #292CF5; }
      .cgreen rect { fill: #E1F5EE; stroke: #0F6E56; }
      .cgreen .th { fill: #085041; } .cgreen .ts { fill: #0F6E56; }
      .cgreen-auto rect { fill: #E1F5EE; stroke: #0F6E56; stroke-dasharray: 5 4; }
      .cgreen-auto .th { fill: #085041; } .cgreen-auto .ts { fill: #0F6E56; }
      .group rect { fill: none; stroke: #0F6E56; }
      .group text { font-size: 12px; font-weight: 700; fill: #085041; }
      .inner rect { fill: #FFFFFF; stroke: #0F6E56; }
      .inner .th { fill: #085041; } .inner .ts { fill: #0F6E56; }
    </style>
  </defs>

  <g class="lane">
    <rect x="20" y="56" width="200" height="874" rx="10" stroke-width="1"/>
    <rect x="250" y="56" width="220" height="874" rx="10" stroke-width="1"/>
    <rect x="500" y="56" width="200" height="874" rx="10" stroke-width="1"/>
  </g>
  <g class="lanehead">
    <rect x="20" y="20" width="200" height="28" rx="6" stroke-width="0.5"/>
    <text x="120" y="34" text-anchor="middle" dominant-baseline="central">MERCHANT</text>
    <rect x="250" y="20" width="220" height="28" rx="6" stroke-width="0.5"/>
    <text x="360" y="34" text-anchor="middle" dominant-baseline="central">PXP AND THE PLATFORM</text>
    <rect x="500" y="20" width="200" height="28" rx="6" stroke-width="0.5"/>
    <text x="600" y="34" text-anchor="middle" dominant-baseline="central">DAOPAY COMPLIANCE</text>
  </g>

  <g class="cblue"><rect x="255" y="76" width="210" height="52" rx="8" stroke-width="0.5"/><text class="th" x="360" y="96" text-anchor="middle" dominant-baseline="central">1. Application completes</text><text class="ts" x="360" y="114" text-anchor="middle" dominant-baseline="central">All six steps done</text></g>
  <line x1="360" y1="128" x2="360" y2="146" class="arr" marker-end="url(#arrow)"/>

  <g class="cblue"><rect x="255" y="146" width="210" height="52" rx="8" stroke-width="0.5"/><text class="th" x="360" y="166" text-anchor="middle" dominant-baseline="central">2. Generate both documents</text><text class="ts" x="360" y="184" text-anchor="middle" dominant-baseline="central">Merchant contract and KYC</text></g>
  <line x1="360" y1="198" x2="360" y2="216" class="arr" marker-end="url(#arrow)"/>

  <g class="cblue"><rect x="255" y="216" width="210" height="52" rx="8" stroke-width="0.5"/><text class="th" x="360" y="236" text-anchor="middle" dominant-baseline="central">3. Send the contract</text><text class="ts" x="360" y="254" text-anchor="middle" dominant-baseline="central">To the merchant first</text></g>
  <line x1="360" y1="268" x2="360" y2="286" class="arr" marker-end="url(#arrow)"/>

  <g class="cblue"><rect x="255" y="286" width="210" height="52" rx="8" stroke-width="0.5"/><text class="th" x="360" y="306" text-anchor="middle" dominant-baseline="central">4. Screening checks run</text><text class="ts" x="360" y="324" text-anchor="middle" dominant-baseline="central">Each result a PDF report</text></g>
  <line x1="360" y1="338" x2="360" y2="356" class="arr" marker-end="url(#arrow)"/>

  <g class="cgray"><rect x="25" y="356" width="675" height="64" rx="8" stroke-width="0.5"/><text class="th" x="362" y="378" text-anchor="middle" dominant-baseline="central">5. The contract is signed in order - three signatures</text><text class="ts" x="362" y="398" text-anchor="middle" dominant-baseline="central">The merchant signs first, then the Daopay CEO, then the Daopay CTO</text></g>
  <line x1="600" y1="420" x2="600" y2="438" class="arr auto" marker-end="url(#arrow)"/>

  <g class="cgreen-auto"><rect x="505" y="438" width="190" height="52" rx="8" stroke-width="0.5"/><text class="th" x="600" y="456" text-anchor="middle" dominant-baseline="central">6. Transfers to Daopay</text><text class="ts" x="600" y="474" text-anchor="middle" dominant-baseline="central">CRM data, plus files by SFTP</text></g>
  <line x1="600" y1="490" x2="600" y2="508" class="arr auto" marker-end="url(#arrow)"/>

  <g class="cgreen-auto"><rect x="505" y="508" width="190" height="52" rx="8" stroke-width="0.5"/><text class="th" x="600" y="528" text-anchor="middle" dominant-baseline="central">7. Compliance notified</text><text class="ts" x="600" y="546" text-anchor="middle" dominant-baseline="central">Handoff complete</text></g>
  <line x1="600" y1="560" x2="600" y2="578" class="arr" marker-end="url(#arrow)"/>

  <g class="cgreen"><rect x="505" y="578" width="190" height="52" rx="8" stroke-width="0.5"/><text class="th" x="600" y="596" text-anchor="middle" dominant-baseline="central">8. Review merchant data</text><text class="ts" x="600" y="614" text-anchor="middle" dominant-baseline="central">In their own CRM</text></g>
  <line x1="600" y1="630" x2="600" y2="648" class="arr" marker-end="url(#arrow)"/>

  <g class="cgreen"><rect x="505" y="648" width="190" height="52" rx="8" stroke-width="0.5"/><text class="th" x="600" y="666" text-anchor="middle" dominant-baseline="central">9. Review documents</text><text class="ts" x="600" y="684" text-anchor="middle" dominant-baseline="central">In their own file storage</text></g>
  <line x1="600" y1="700" x2="600" y2="718" class="arr" marker-end="url(#arrow)"/>

  <g class="group"><rect x="25" y="718" width="675" height="110" rx="12" stroke-width="0.5"/><text x="362" y="738" text-anchor="middle" dominant-baseline="central">10. Record the decision in the portal - one of three</text></g>
  <g class="inner"><rect x="45" y="756" width="205" height="56" rx="8" stroke-width="0.5"/><text class="th" x="147" y="776" text-anchor="middle" dominant-baseline="central">Reject</text><text class="ts" x="147" y="794" text-anchor="middle" dominant-baseline="central">Status becomes Rejected</text></g>
  <g class="inner"><rect x="260" y="756" width="205" height="56" rx="8" stroke-width="0.5"/><text class="th" x="362" y="776" text-anchor="middle" dominant-baseline="central">Pending further information</text><text class="ts" x="362" y="794" text-anchor="middle" dominant-baseline="central">Plus a note - notifies PXP accounts</text></g>
  <g class="inner"><rect x="475" y="756" width="205" height="56" rx="8" stroke-width="0.5"/><text class="th" x="577" y="776" text-anchor="middle" dominant-baseline="central">Approve</text><text class="ts" x="577" y="794" text-anchor="middle" dominant-baseline="central">Send KYC and approve merchant</text></g>

  <path d="M577 828 L577 842 L120 842 L120 860" class="arr" marker-end="url(#arrow)"/>

  <g class="cgray"><rect x="25" y="860" width="190" height="52" rx="8" stroke-width="0.5"/><text class="th" x="120" y="878" text-anchor="middle" dominant-baseline="central">11. Merchant signs the KYC</text><text class="ts" x="120" y="896" text-anchor="middle" dominant-baseline="central">One signature - onboarding done</text></g>
</svg>
