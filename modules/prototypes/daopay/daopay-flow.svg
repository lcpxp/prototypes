<svg xmlns="http://www.w3.org/2000/svg" width="720" height="862" viewBox="0 0 720 862" role="img">
  <title>Daopay underwriting - where your involvement sits</title>
  <desc>Eleven steps in sequence. Steps one to five are handled by PXP, the platform and the merchant. Step six transfers everything to Daopay automatically: merchant and application data to their CRM, contract files and screening PDFs by SFTP. Steps seven to ten are the Daopay compliance team's: being notified, reviewing the merchant data in their CRM, reviewing the documents in their file storage, and then recording the decision in the portal. Step ten branches into three outcomes: reject, which closes the application; pending further information, which sends a note to the PXP accounts team; and approve, which sends the KYC contract to the merchant. Only approval leads on to step eleven, the merchant signing the KYC contract.</desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="tipOn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#0F6E56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .off rect { fill: #F4F4F5; stroke: #D4D4D8; }
      .off .n { fill: #E4E4E7; }
      .off .nt { fill: #71717A; }
      .off .t { fill: #71717A; font-size: 13px; font-weight: 500; }
      .off .s { fill: #A1A1AA; font-size: 11px; font-weight: 400; }
      .off .a { fill: #A1A1AA; font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; }
      .auto rect { stroke-dasharray: 5 4; }
      .on rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1.6; }
      .on .n { fill: #0F6E56; }
      .on .nt { fill: #FFFFFF; }
      .on .t { fill: #08402F; font-size: 13.5px; font-weight: 700; }
      .on .s { fill: #0F6E56; font-size: 11px; font-weight: 400; }
      .on .a { fill: #0F6E56; font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; }
      .nt { font-size: 12px; font-weight: 700; }
      .band { stroke: #0F6E56; stroke-width: 1.2; stroke-dasharray: 6 5; }
      .bandtext { fill: #0F6E56; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .pick rect { fill: #FFFFFF; stroke: #0F6E56; stroke-width: 1.4; }
      .pick .t { fill: #08402F; font-size: 12.5px; font-weight: 700; }
      .pick .s { fill: #0F6E56; font-size: 10.5px; font-weight: 400; }
      .chip rect { fill: #FFF4E5; stroke: #C98A2E; stroke-width: 1; stroke-dasharray: 4 3; }
      .chip text { fill: #8A4B00; font-size: 10.5px; font-weight: 600; }
      .tag { fill: #0F6E56; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; }
      .link { stroke: #D4D4D8; stroke-width: 1.2; }
      .linkOn { stroke: #0F6E56; stroke-width: 1.4; }
    </style>
  </defs>

  <g class="off">
    <rect x="48" y="14" width="644" height="40" rx="8" stroke-width="1"/>
    <circle class="n" cx="76" cy="34" r="13"/><text class="nt" x="76" y="34" text-anchor="middle" dominant-baseline="central">1</text>
    <text class="t" x="100" y="34" dominant-baseline="central">The merchant application is completed</text>
    <text class="a" x="676" y="34" text-anchor="end" dominant-baseline="central">PXP</text>
  </g>
  <line x1="76" y1="54" x2="76" y2="64" class="link" marker-end="url(#tip)"/>

  <g class="off">
    <rect x="48" y="64" width="644" height="40" rx="8" stroke-width="1"/>
    <circle class="n" cx="76" cy="84" r="13"/><text class="nt" x="76" y="84" text-anchor="middle" dominant-baseline="central">2</text>
    <text class="t" x="100" y="84" dominant-baseline="central">Both documents are generated: the merchant contract and the KYC</text>
    <text class="a" x="676" y="84" text-anchor="end" dominant-baseline="central">PXP</text>
  </g>
  <line x1="76" y1="104" x2="76" y2="114" class="link" marker-end="url(#tip)"/>

  <g class="off">
    <rect x="48" y="114" width="644" height="40" rx="8" stroke-width="1"/>
    <circle class="n" cx="76" cy="134" r="13"/><text class="nt" x="76" y="134" text-anchor="middle" dominant-baseline="central">3</text>
    <text class="t" x="100" y="134" dominant-baseline="central">The contract goes to the merchant first, for their signature</text>
    <text class="a" x="676" y="134" text-anchor="end" dominant-baseline="central">PXP</text>
  </g>
  <line x1="76" y1="154" x2="76" y2="164" class="link" marker-end="url(#tip)"/>

  <g class="off auto">
    <rect x="48" y="164" width="644" height="40" rx="8" stroke-width="1"/>
    <circle class="n" cx="76" cy="184" r="13"/><text class="nt" x="76" y="184" text-anchor="middle" dominant-baseline="central">4</text>
    <text class="t" x="100" y="184" dominant-baseline="central">Screening checks run - each result is available as a PDF report</text>
    <text class="a" x="676" y="184" text-anchor="end" dominant-baseline="central">AUTOMATIC</text>
  </g>
  <line x1="76" y1="204" x2="76" y2="214" class="link" marker-end="url(#tip)"/>

  <g class="off">
    <rect x="48" y="214" width="644" height="40" rx="8" stroke-width="1"/>
    <circle class="n" cx="76" cy="234" r="13"/><text class="nt" x="76" y="234" text-anchor="middle" dominant-baseline="central">5</text>
    <text class="t" x="100" y="234" dominant-baseline="central">The contract is signed in order by all three parties</text>
    <text class="a" x="676" y="234" text-anchor="end" dominant-baseline="central">MERCHANT, THEN CEO, THEN CTO</text>
  </g>
  <line x1="76" y1="254" x2="76" y2="264" class="link" marker-end="url(#tip)"/>

  <g class="off auto">
    <rect x="48" y="264" width="644" height="62" rx="8" stroke-width="1"/>
    <circle class="n" cx="76" cy="295" r="13"/><text class="nt" x="76" y="295" text-anchor="middle" dominant-baseline="central">6</text>
    <text class="t" x="100" y="285" dominant-baseline="central">Everything transfers into your systems</text>
    <text class="s" x="100" y="305" dominant-baseline="central">Merchant and application data to your CRM; contract files and screening PDFs by SFTP</text>
    <text class="a" x="676" y="295" text-anchor="end" dominant-baseline="central">AUTOMATIC</text>
  </g>

  <line x1="28" y1="352" x2="692" y2="352" class="band"/>
  <rect x="246" y="340" width="228" height="24" fill="#FFFFFF"/>
  <text class="bandtext" x="360" y="352" text-anchor="middle" dominant-baseline="central">YOUR INVOLVEMENT STARTS HERE</text>

  <g class="on">
    <rect x="48" y="376" width="644" height="42" rx="8"/>
    <circle class="n" cx="76" cy="397" r="13"/><text class="nt" x="76" y="397" text-anchor="middle" dominant-baseline="central">7</text>
    <text class="t" x="100" y="397" dominant-baseline="central">You are notified - everything is already in your systems</text>
    <text class="a" x="676" y="397" text-anchor="end" dominant-baseline="central">NOTIFICATION</text>
  </g>
  <line x1="76" y1="418" x2="76" y2="428" class="linkOn" marker-end="url(#tipOn)"/>

  <g class="on">
    <rect x="48" y="428" width="644" height="54" rx="8"/>
    <circle class="n" cx="76" cy="455" r="13"/><text class="nt" x="76" y="455" text-anchor="middle" dominant-baseline="central">8</text>
    <text class="t" x="100" y="446" dominant-baseline="central">Review the merchant data</text>
    <text class="s" x="100" y="466" dominant-baseline="central">All merchant and application data, in your CRM</text>
    <text class="a" x="676" y="455" text-anchor="end" dominant-baseline="central">YOUR CRM</text>
  </g>
  <line x1="76" y1="482" x2="76" y2="492" class="linkOn" marker-end="url(#tipOn)"/>

  <g class="on">
    <rect x="48" y="492" width="644" height="54" rx="8"/>
    <circle class="n" cx="76" cy="519" r="13"/><text class="nt" x="76" y="519" text-anchor="middle" dominant-baseline="central">9</text>
    <text class="t" x="100" y="510" dominant-baseline="central">Review the documents</text>
    <text class="s" x="100" y="530" dominant-baseline="central">The contract files and the screening check PDFs, in your file storage</text>
    <text class="a" x="676" y="519" text-anchor="end" dominant-baseline="central">YOUR FILE STORAGE</text>
  </g>
  <line x1="76" y1="546" x2="76" y2="556" class="linkOn" marker-end="url(#tipOn)"/>

  <g class="on">
    <rect x="48" y="556" width="644" height="42" rx="8"/>
    <circle class="n" cx="76" cy="577" r="13"/><text class="nt" x="76" y="577" text-anchor="middle" dominant-baseline="central">10</text>
    <text class="t" x="100" y="577" dominant-baseline="central">Record your decision - one of three</text>
    <text class="a" x="676" y="577" text-anchor="end" dominant-baseline="central">IN LAUNCHPAD</text>
  </g>

  <path d="M369 598 L369 607 L151 607 L151 616" class="arr linkOn" fill="none" marker-end="url(#tipOn)"/>
  <line x1="369" y1="598" x2="369" y2="616" class="linkOn" marker-end="url(#tipOn)"/>
  <path d="M369 598 L369 607 L587 607 L587 616" class="arr linkOn" fill="none" marker-end="url(#tipOn)"/>

  <g class="pick">
    <rect x="48" y="616" width="206" height="78" rx="8"/>
    <text class="t" x="151" y="638" text-anchor="middle" dominant-baseline="central">Reject</text>
    <text class="s" x="151" y="658" text-anchor="middle" dominant-baseline="central">Set to Rejected in the dropdown</text>
    <text class="s" x="151" y="676" text-anchor="middle" dominant-baseline="central">The application is closed</text>
  </g>
  <g class="pick">
    <rect x="266" y="616" width="206" height="78" rx="8"/>
    <text class="t" x="369" y="638" text-anchor="middle" dominant-baseline="central">Pending further information</text>
    <text class="s" x="369" y="658" text-anchor="middle" dominant-baseline="central">Set in the dropdown, add a note</text>
    <text class="s" x="369" y="676" text-anchor="middle" dominant-baseline="central">It will not send without one</text>
  </g>
  <g class="pick">
    <rect x="484" y="616" width="206" height="78" rx="8"/>
    <text class="t" x="587" y="638" text-anchor="middle" dominant-baseline="central">Approve</text>
    <text class="s" x="587" y="658" text-anchor="middle" dominant-baseline="central">Send KYC and approve merchant</text>
    <text class="s" x="587" y="676" text-anchor="middle" dominant-baseline="central">Sending the KYC is the approval</text>
  </g>

  <line x1="369" y1="694" x2="369" y2="710" class="arr" marker-end="url(#tip)"/>
  <g class="chip">
    <rect x="266" y="710" width="206" height="30" rx="6"/>
    <text x="369" y="725" text-anchor="middle" dominant-baseline="central">Your note goes to PXP accounts</text>
  </g>

  <line x1="587" y1="694" x2="587" y2="782" class="linkOn" marker-end="url(#tipOn)"/>
  <text class="tag" x="596" y="726" dominant-baseline="central">ONLY APPROVAL</text>
  <text class="tag" x="596" y="740" dominant-baseline="central">CONTINUES</text>

  <line x1="28" y1="756" x2="692" y2="756" class="band"/>
  <rect x="150" y="744" width="188" height="24" fill="#FFFFFF"/>
  <text class="bandtext" x="244" y="756" text-anchor="middle" dominant-baseline="central">YOUR PART IS DONE</text>

  <g class="off">
    <rect x="48" y="782" width="644" height="40" rx="8" stroke-width="1"/>
    <circle class="n" cx="76" cy="802" r="13"/><text class="nt" x="76" y="802" text-anchor="middle" dominant-baseline="central">11</text>
    <text class="t" x="100" y="802" dominant-baseline="central">The merchant signs the KYC contract - onboarding complete</text>
    <text class="a" x="676" y="802" text-anchor="end" dominant-baseline="central">MERCHANT</text>
  </g>

  <text class="a" x="48" y="846" fill="#A1A1AA" font-size="10.5" font-weight="500">Dashed outline = happens automatically, with no one pressing anything.</text>
</svg>
