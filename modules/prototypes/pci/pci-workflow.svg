<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 800" role="img">
  <title>Confirmed IXOPAY solution — enrolment, invitation, monitoring</title>
  <desc>Merchant data captured in Launchpad. Compliant merchants are verified via IXOPAY records and enter monitoring. Non-compliant merchants are enrolled via one API call with the full payload. IXOPAY derives and pre-fills the SAQ, emails an invitation link, guides completion, chases merchants, and runs the annual lifecycle forever. Launchpad adds the fee product on invitation sent, monitors via webhook and 15 to 30 day polling, and pulls reports. Both converge on a merchant status chip. IXOPAY bills monthly per enrolled merchant.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
      .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
      .arr { stroke: #5F5E5A; stroke-width: 1; fill: none; }
      .box rect { fill: #FFFFFF; stroke: #B4B2A9; }
      .cgray rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .cpurple rect { fill: #EEEDFE; stroke: #534AB7; }
      .cpurple > .th { fill: #3C3489; } .cpurple > .ts { fill: #534AB7; }
      .cteal rect { fill: #E1F5EE; stroke: #0F6E56; }
      .cteal > .th { fill: #085041; } .cteal > .ts { fill: #0F6E56; }
    </style>
  </defs>

  <g class="cgray"><rect x="210" y="30" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Merchant data captured</text><text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">Business, sites, products, as today</text></g>
  <line x1="340" y1="86" x2="340" y2="116" class="arr" marker-end="url(#arrow)"/>

  <g class="cpurple"><rect x="210" y="118" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="140" text-anchor="middle" dominant-baseline="central">Already PCI compliant?</text><text class="ts" x="340" y="158" text-anchor="middle" dominant-baseline="central">Agent prompt</text></g>

  <path d="M210 146 L175 146 L175 204" class="arr" marker-end="url(#arrow)"/>
  <path d="M470 146 L505 146 L505 204" class="arr" marker-end="url(#arrow)"/>

  <g class="cteal"><rect x="40" y="206" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="175" y="228" text-anchor="middle" dominant-baseline="central">Yes — verify existing</text><text class="ts" x="175" y="246" text-anchor="middle" dominant-baseline="central">Checked against IXOPAY records</text></g>
  <g class="cpurple"><rect x="370" y="206" width="270" height="56" rx="8" stroke-width="0.5"/><text class="th" x="505" y="228" text-anchor="middle" dominant-baseline="central">No — enrol via API</text><text class="ts" x="505" y="246" text-anchor="middle" dominant-baseline="central">One call, full merchant payload</text></g>

  <line x1="175" y1="262" x2="175" y2="296" class="arr" marker-end="url(#arrow)"/>
  <line x1="505" y1="262" x2="505" y2="296" class="arr" marker-end="url(#arrow)"/>

  <g class="cpurple"><rect x="40" y="298" width="270" height="292" rx="12" stroke-width="0.5"/><text class="th" x="175" y="324" text-anchor="middle">Launchpad reacts</text></g>
  <g class="box"><rect x="60" y="338" width="230" height="48" rx="8" stroke-width="0.5"/><text class="th" x="175" y="356" text-anchor="middle" dominant-baseline="central">Fee product to basket</text><text class="ts" x="175" y="374" text-anchor="middle" dominant-baseline="central">On invitation sent event</text></g>
  <g class="box"><rect x="60" y="400" width="230" height="48" rx="8" stroke-width="0.5"/><text class="th" x="175" y="418" text-anchor="middle" dominant-baseline="central">Monitor status</text><text class="ts" x="175" y="436" text-anchor="middle" dominant-baseline="central">Webhook + 15 to 30 day poll</text></g>
  <g class="box"><rect x="60" y="462" width="230" height="48" rx="8" stroke-width="0.5"/><text class="th" x="175" y="480" text-anchor="middle" dominant-baseline="central">Reporting API pulls</text><text class="ts" x="175" y="498" text-anchor="middle" dominant-baseline="central">Totals and per-merchant data</text></g>
  <g class="box"><rect x="60" y="524" width="230" height="48" rx="8" stroke-width="0.5"/><text class="th" x="175" y="542" text-anchor="middle" dominant-baseline="central">Records stay with IXOPAY</text><text class="ts" x="175" y="560" text-anchor="middle" dominant-baseline="central">Bucket export optional only</text></g>

  <g class="cteal"><rect x="370" y="298" width="270" height="292" rx="12" stroke-width="0.5"/><text class="th" x="505" y="324" text-anchor="middle">IXOPAY manages</text></g>
  <g class="box"><rect x="390" y="338" width="230" height="48" rx="8" stroke-width="0.5"/><text class="th" x="505" y="356" text-anchor="middle" dominant-baseline="central">SAQ derived, pre-filled</text><text class="ts" x="505" y="374" text-anchor="middle" dominant-baseline="central">Worked out from our payload</text></g>
  <line x1="505" y1="386" x2="505" y2="398" class="arr" marker-end="url(#arrow)"/>
  <g class="box"><rect x="390" y="400" width="230" height="48" rx="8" stroke-width="0.5"/><text class="th" x="505" y="418" text-anchor="middle" dominant-baseline="central">Email invitation link</text><text class="ts" x="505" y="436" text-anchor="middle" dominant-baseline="central">Merchant completes in own time</text></g>
  <line x1="505" y1="448" x2="505" y2="460" class="arr" marker-end="url(#arrow)"/>
  <g class="box"><rect x="390" y="462" width="230" height="48" rx="8" stroke-width="0.5"/><text class="th" x="505" y="480" text-anchor="middle" dominant-baseline="central">Guided easy completion</text><text class="ts" x="505" y="498" text-anchor="middle" dominant-baseline="central">Non-technical friendly</text></g>
  <line x1="505" y1="510" x2="505" y2="522" class="arr" marker-end="url(#arrow)"/>
  <g class="box"><rect x="390" y="524" width="230" height="48" rx="8" stroke-width="0.5"/><text class="th" x="505" y="542" text-anchor="middle" dominant-baseline="central">Chasing + annual cycle</text><text class="ts" x="505" y="560" text-anchor="middle" dominant-baseline="central">Their reminders, forever</text></g>

  <path d="M390 424 L340 424 L340 362 L292 362" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <path d="M390 486 L330 486 L330 424 L292 424" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <path d="M175 590 L175 614 L340 614 L340 640" fill="none" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M505 590 L505 614 L340 614" fill="none" stroke="#0F6E56" stroke-width="1"/>

  <g class="cgray"><rect x="190" y="642" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="664" text-anchor="middle" dominant-baseline="central">Merchant status chip</text><text class="ts" x="340" y="682" text-anchor="middle" dominant-baseline="central">Invited, chased, in progress, compliant</text></g>

  <text class="ts" x="340" y="738" text-anchor="middle">IXOPAY bills us monthly per enrolled merchant, fee passed on via the basket product</text>
  <text class="ts" x="340" y="760" text-anchor="middle">Same rails later: website screening, GDPR, PEPs and sanctions, Webshield</text>
</svg>
