<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://zlmkofbkobmhnslfnqsf.supabase.co" crossorigin>
  <title>Sprint roadmap - LPIO</title>
  <script src="../../assets/js/core/theme.js"></script>
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
  <link rel="stylesheet" href="../../assets/css/console-tool.css">
  <link rel="stylesheet" href="../../assets/css/roadmap-themes.css">
  <link rel="stylesheet" href="../../assets/css/roadmap-views.css">
  <link rel="stylesheet" href="../../assets/css/roadmap-detail.css">
  <link rel="stylesheet" href="../../assets/css/sprints.css">
  <link rel="stylesheet" href="../../assets/css/sprint-cards.css">
  <link rel="stylesheet" href="../../assets/css/skeleton.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.3"></script>
  <script defer src="../../assets/js/core/supabase.js"></script>
  <script defer src="../../assets/js/core/registry.js"></script>
  <script defer src="../../assets/js/core/guard.js"></script>
  <script defer src="../../assets/js/core/ui.js"></script>
  <script defer src="../../assets/js/core/search.js"></script>
  <script defer src="../../assets/js/core/tools.js"></script>
  <script defer src="../../assets/js/core/console-tools.js"></script>
  <script defer src="../../assets/js/core/sprints.js"></script>
  <script defer src="../../assets/js/core/detail.js"></script>
  <script defer src="../../assets/js/pages/roadmap/views.js"></script>
  <script defer src="../../assets/js/pages/roadmap/detail-values.js"></script>
  <script defer src="../../assets/js/pages/roadmap/views-sprint.js"></script>
  <script defer src="../../assets/js/pages/roadmap/views-sprint-cards.js"></script>
  <script defer src="../../assets/js/pages/shared/lazy-detail.js"></script>
  <script defer src="../../assets/js/pages/shared/work-items-data.js"></script>
  <script defer src="../../assets/js/pages/roadmap/detail.js"></script>
  <script defer src="../../assets/js/pages/roadmap/drawer.js"></script>
  <script defer src="../../assets/js/pages/sprints/sprints.js"></script>
</head>
<body data-root="../.." data-module="sprints">
  <header id="app-nav"></header>

  <main class="page page--wide">
    <div class="page-head">
      <span class="eyebrow">Sprint roadmap</span>
      <h1>The Now column, across sprints</h1>
      <p class="sp-status" id="sprints-state"></p>
      <p class="lede">The <a href="../roadmap/">product roadmap</a> says what
        is being built and in what order; this says when. Every bar opens
        that item's full detail.</p>
      <p class="rm-print-hint">Print in landscape.</p>
    </div>

    <div class="rm-toolbar">
      <nav class="rmv-switch" id="sprints-switch" role="tablist"
           aria-label="Sprint roadmap view"></nav>
      <button class="rm-icon-toggle rm-toggle-labelled rm-wide-toggle"
        type="button" id="sprints-wide" aria-pressed="false"
        title="Draw the sprint columns at double width">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 3 21 3 21 9"></polyline>
          <polyline points="9 21 3 21 3 15"></polyline>
          <line x1="21" y1="3" x2="14" y2="10"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
        <span>Wider columns</span>
      </button>
      <button class="rm-icon-toggle rm-toggle-labelled rm-hide-toggle"
        type="button" id="sprints-hide" aria-pressed="false"
        title="Show an eye on every row, to set rows aside for this discussion">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 3l18 18"></path>
          <path d="M10.6 5.1A9.7 9.7 0 0 1 12 5c5 0 9 4.5 9 7a12 12 0 0 1-2.4 3.4"></path>
          <path d="M6.3 6.4A12.4 12.4 0 0 0 3 12c0 2.5 4 7 9 7a9.6 9.6 0 0 0 4.2-1"></path>
          <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
        </svg>
        <span>Hide rows</span>
      </button>
    </div>

    <section id="sprints-content">
      <p class="notice">Loading</p>
    </section>
  </main>

  <aside class="rmd-drawer" id="roadmap-drawer" role="dialog" aria-modal="true"
    aria-label="Work item detail" tabindex="-1" hidden>
    <button class="rmd-close button quiet" type="button" id="rmd-close">Close</button>
    <div id="rmd-body"></div>
  </aside>
</body>
</html>
